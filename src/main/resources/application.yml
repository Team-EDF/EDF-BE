  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edf}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 6000
      database: 0

ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-exp: ${JWT_ACCESS_EXP:900}
  refresh-exp: ${JWT_REFRESH_EXP:3000}

google:
  api:
    key: ${GOOGLE_API_KEY}
  maps:
    id: ${GOOGLE_MAPS_ID}

# GPS 이동수단 인증(/dashboard/certify-transit) 서버 측 거리 검증용.
# 현재는 프론트가 계산한 distanceKm/savedCarbon 값을 그대로 신뢰하고 있어,
# 추후 Directions/Distance Matrix API로 이동거리를 재검증하려면 이 키가 필요하다.
# 값이 따로 없으면 GOOGLE_API_KEY 를 재사용한다(Google Maps Platform 키는 API 여러 개에 공용 가능).
transit:
  distance-validation:
    api-key: ${GOOGLE_DISTANCE_API_KEY:${GOOGLE_API_KEY}}

kakao:
  api:
    key: ${KAKAO_API_KEY}

coolsms:
  api-key: ${COOLSMS_API_KEY}
  api-secret: ${COOLSMS_API_SECRET}
  sender: ${COOLSMS_SENDER}

file:
  upload:
    local-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size-mb: 10
    allowed-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
    url-prefix: /files

