  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edf}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 6000
      database: 0

ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}

server:
  port: 8080
  error:
    # ResponseStatusException 의 사유를 응답 message 로 내려 앱이 그대로 보여 줄 수 있게 한다.
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-exp: ${JWT_ACCESS_EXP:900}
  refresh-exp: ${JWT_REFRESH_EXP:3000}

google:
  api:
    key: ${GOOGLE_API_KEY}
  oauth:
    # 앱 Google 로그인 ID 토큰의 aud(발급 대상) 허용 목록. 쉼표로 여러 개 가능.
    # Android 앱은 GoogleSignin.configure({ webClientId }) 로 받으므로 "웹 클라이언트 ID" 를 넣는다.
    # (k8s backend-secret 의 GOOGLE_CLIENT_ID 를 그대로 쓴다. 비어 있으면 Google 로그인을 거부한다)
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:${GOOGLE_CLIENT_ID:}}
  maps:
    id: ${GOOGLE_MAPS_ID}

transit:
  distance-validation:
    api-key: ${GOOGLE_DISTANCE_API_KEY:${GOOGLE_API_KEY}}

kakao:
  api:
    key: ${KAKAO_API_KEY}

naver:
  news-api:
    url: ${NAVER_NEWS_API_URL:}
    client-id: ${NAVER_API_HUB_CLIENT_ID:}
    client-secret: ${NAVER_API_HUB_CLIENT_SECRET:}

file:
  upload:
    local-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size-mb: 10
    allowed-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
    url-prefix: /files
app:
  admin:
    enabled: ${ADMIN_ENABLED:true}
    # 비어 있으면 관리자 계정을 만들지 않고 서버는 정상 기동한다 (AdminAccountInitializer)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:관리자}

# 친환경 활동 인증 남용 방지 (사진 인증 / GPS 이동 인증)
activity:
  certify:
    daily-limit-per-category: ${ACTIVITY_DAILY_LIMIT_PER_CATEGORY:2}
    daily-limit-total: ${ACTIVITY_DAILY_LIMIT_TOTAL:6}
    image-max-age-hours: ${ACTIVITY_IMAGE_MAX_AGE_HOURS:24}
  transit:
    daily-limit: ${TRANSIT_DAILY_LIMIT:6}
